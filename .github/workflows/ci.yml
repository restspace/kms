name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build BEFORE test: the workers test project boots miniflare from
      # wrangler.toml, whose [assets] binding needs apps/public/dist to exist.
      # The build also runs the admin SPA's own tsc typecheck. Either half
      # failing makes the deployment unusable, so both bundles are exercised.
      - run: npm run build
      - run: npm test
      # Validates wrangler.toml, bindings, module rules and bundling without
      # credentials — catches deploy-shaped breakage on every PR.
      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run --outdir dry-run-dist
      # Advisory only: gating on audit in a large dev-dependency tree breaks
      # CI on unrelated advisories; production deps are the signal.
      - name: npm audit (advisory)
        run: npm audit --omit=dev || true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets cannot be referenced in a job-level `if`, so the secret is mapped
    # into the job env and a first step gates the rest of the job on it. Forks
    # and clones without CLOUDFLARE_API_TOKEN skip the deploy cleanly.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN secret not set — skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.present == 'true'

      # Jobs run on separate machines and dist/ is intentionally gitignored;
      # rebuild the assets that Wrangler packages with the Worker.
      - run: npm run build
        if: steps.creds.outputs.present == 'true'

      # Migrations apply via `wrangler d1 migrations apply kms --remote` before
      # the Worker deploys, so schema and code stay in step (docs/03 §11).
      - name: Apply D1 migrations
        if: steps.creds.outputs.present == 'true'
        run: npx wrangler d1 migrations apply kms --remote

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        run: npx wrangler deploy
