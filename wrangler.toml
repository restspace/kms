# KMS — Cloudflare Worker config. See docs/03-architecture.md.
# D1 is the system of record; KV holds magic-link tokens, sessions and cached aggregates.
# No Queues: background jobs use the D1 outbox + the cron sweep (docs/03 §2a).

name = "kms"
main = "apps/api/src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# One JSX idiom, two build targets (docs/03 §3). The Worker's SSR bundle resolves
# the React API onto preact/compat, exactly as the public client bundle does.
[alias]
react = "preact/compat"
"react-dom" = "preact/compat"
"react/jsx-runtime" = "preact/jsx-runtime"

[assets]
directory = "./apps/public/dist"
binding = "ASSETS"
# /app (the admin SPA shell) must hit the Worker's session gate even though
# dist/app/index.html exists as an asset; hashed files under /app/assets/*
# stay on the asset fast path.
run_worker_first = ["/app", "/app/"]

[[d1_databases]]
binding = "DB"
database_name = "kms"
database_id = "23da825a-d5e3-4b70-8783-36fc47619b6e"
migrations_dir = "packages/db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "8d840a61775244d7a7439618b8d699c0"

[triggers]
crons = ["* * * * *"] # outbox retry sweep + reminder sweeps

[vars]
APP_URL = "https://kms.r-s.workers.dev" # local dev overrides via .dev.vars
EVENT_DEFAULT_TZ = "America/Los_Angeles"
EMAIL_PROVIDER = "resend"
AIRTABLE_SYNC = "off"
USE_QUEUES = "off"
DEV_MODE = "off" # "on" exposes the magic link in the /auth/request response instead of emailing it; local dev re-enables it via .dev.vars

# R2 binding intentionally absent for M0 — needs the r2 OAuth scope + card on file (see docs/12 M2).
