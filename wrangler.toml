name = "kms"
main = "apps/public/src/index.tsx"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# One JSX idiom, two build targets (docs/03 §3). The Worker's SSR bundle resolves
# the React API onto preact/compat, exactly as the public client bundle does.
[alias]
react = "preact/compat"
"react-dom" = "preact/compat"
"react/jsx-runtime" = "preact/jsx-runtime"

[vars]
APP_URL = "http://localhost:8787"
EVENT_DEFAULT_TZ = "America/Los_Angeles"
AIRTABLE_SYNC = "off"
USE_QUEUES = "off"

[assets]
directory = "./apps/public/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kms"
database_id = "00000000-0000-0000-0000-000000000000" # replaced by `wrangler d1 create kms`
migrations_dir = "packages/db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "0000000000000000000000000000000f" # replaced by `wrangler kv namespace create KV`
